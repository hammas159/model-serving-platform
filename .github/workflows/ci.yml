name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Everything under test is a routing and lifecycle behaviour, not a modelling
    # one, so CI needs no training, no weights and no GPU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-groups
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q
