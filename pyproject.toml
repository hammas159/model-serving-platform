[project]
name = "model-serving-platform"
version = "0.1.0"
description = "Multi-model serving with A/B testing, canary rollout, shadow traffic, SLOs and auto-rollback."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]
ui  = ["streamlit>=1.40", "pandas>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serving"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
